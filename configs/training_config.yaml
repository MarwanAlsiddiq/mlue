# Training Configuration for Different Environments

# Local Training (CPU/Limited GPU)
local:
  batch_size: 32
  epochs: 30
  learning_rate: 0.0001
  hidden_dim: 128
  num_layers: 3
  mixed_precision: false
  early_stopping_patience: 8

# Kaggle GPU Training
kaggle:
  batch_size: 64
  epochs: 50
  learning_rate: 0.0001
  hidden_dim: 256
  num_layers: 4
  mixed_precision: true
  early_stopping_patience: 10
  gradient_clipping: 1.0

# High-Performance Training (A100/V100)
high_performance:
  batch_size: 128
  epochs: 100
  learning_rate: 0.0002
  hidden_dim: 512
  num_layers: 6
  mixed_precision: true
  early_stopping_patience: 15
  gradient_clipping: 1.0
  accumulate_gradients: 2
